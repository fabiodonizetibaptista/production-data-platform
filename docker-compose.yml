services:

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    network_mode: host

    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__PARALLELISM: "2"

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags

      # Apenas para o laboratório no Codespace.
      # Em uma implantação real manteríamos autenticação habilitada.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      PYTHONPATH: /opt/airflow/project

    working_dir: /opt/airflow/project

    volumes:
      - .:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs

    command: airflow standalone

    restart: unless-stopped


volumes:
  postgres_data:
  airflow_logs:
